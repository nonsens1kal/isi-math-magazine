name: Build PDF

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: magazine-pdf
          path: main.pdf
